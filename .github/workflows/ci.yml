name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_call: { }

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build_setup
      - name: Lint
        run: ./gradlew :app:lintFreeDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: app/build/reports/**/*.html
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build_setup
      - name: Check locale config
        run: ./scripts/check_locale_config.main.kts
      - name: Create signing files
        if: github.event_name == 'push' && github.ref_name == 'develop'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > signing/signing.keystore
          cat > signing/signing.properties <<EOF
          STORE_PASSWORD=$ANDROID_STORE_PASSWORD
          KEY_ALIAS=$ANDROID_KEY_ALIAS
          KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF
      - name: Tests + Formatting + Build
        run: ./gradlew voiceUnitTest lintKotlin :app:assembleFreeDebug
      - name: Publish JUnit Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/test-results/**/TEST-*.xml'
          check_name: "Unit Tests"
      - name: Upload APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v7
        with:
          name: voice-debug-apk
          path: app/build/outputs/apk/free/debug/*.apk

  instrumentation:
    # Temporarily disable
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build_setup
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Accept Android Licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Setup Managed Devices
        run: ./gradlew voiceDeviceSetup -Pandroid.testoptions.manageddevices.emulator.gpu="swiftshader_indirect"
      - name: Run Instrumentation Tests
        run: ./gradlew voiceDeviceFreeDebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu="swiftshader_indirect"
      - name: Publish JUnit Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/test-results/**/TEST-*.xml'
          check_name: "Instrumentation Tests"
